[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrcat"
version = "1.0.0"
description = "Render QR codes directly to the terminal using just block chars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "Marcin Orlowski", email = "mail@MarcinOrlowski.com"}]
dependencies = [
    "segno>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
qrcat = "qrcat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrcat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
